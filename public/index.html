<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#650000">
  <title>Crimson Chat</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main class="app-shell">
    <section id="joinScreen" class="join-screen">
      <div class="join-header">CRIMSON CHAT</div>
      <div class="join-card">
        <div class="join-caption">THREE PERSON NETWORK</div>
        <h1>join chat</h1>
        <p>Enter your name to access the public and private chats.</p>
        <form id="joinForm">
          <label for="nameInput">name</label>
          <input id="nameInput" name="name" maxlength="20" minlength="2" autocomplete="nickname" placeholder="your name" required>
          <button type="submit">enter</button>
        </form>
        <p class="join-status" id="slotText">0 / 3 people online</p>
        <p id="joinError" class="join-error" role="alert"></p>
      </div>
    </section>

    <section id="mainScreen" class="main-screen hidden" aria-label="Chat interface">
      <header id="topbar" class="topbar">
        <div id="publicNav" class="person-tabs" aria-label="Select a person">
          <div id="usersNav" class="people-grid"></div>
        </div>
        <div id="privateNav" class="simple-header hidden">
          <button id="backFromPrivate" class="back-button" type="button" aria-label="Back to public chat">←</button>
          <span id="privateName" class="header-title">name</span>
        </div>
        <div id="mapNav" class="simple-header hidden">
          <button id="backFromMap" class="back-button" type="button" aria-label="Back to chat">←</button>
          <span class="header-title">map</span>
        </div>
        <button id="mapOpen" class="map-open" aria-label="Open map" title="Open map" type="button"><span></span><span></span><span></span></button>
      </header>

      <section id="chatScreen" class="chat-screen">
        <div id="chatPanel" class="chat-panel">
          <div id="messages" class="messages" role="log" aria-live="polite"></div>
          <form id="messageForm" class="composer">
            <input id="messageInput" type="text" autocomplete="off" maxlength="1500" aria-label="Type your message" placeholder="message" required>
            <button type="submit" aria-label="Send message">➤</button>
          </form>
        </div>
        <div id="chatStatus" class="chat-status">public chat</div>
      </section>

      <section id="mapScreen" class="map-screen hidden">
        <div class="map-panel">
          <div class="map-actions">
            <button id="pinButton" type="button">mark area</button>
            <button id="pathButton" type="button">path</button>
          </div>
          <div id="mapHelp" class="map-help">tap “mark area” or “path”</div>
          <div id="mapCanvas" class="map-canvas" aria-label="Shared illustrated map image">
            <img src="/map-image.png" alt="Your cleaned-up map picture" draggable="false">
            <svg id="mapLines" class="map-lines" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div id="mapPins" class="map-pins"></div>
          </div>
          <div id="draftActions" class="draft-actions hidden">
            <span id="draftCount">0 points</span>
            <button id="undoPoint" type="button">undo</button>
            <button id="cancelDraft" type="button">cancel</button>
            <button id="finishPath" type="button">finish</button>
          </div>
          <div class="map-list-head"><span id="mapVisibility">public map</span><span id="annotationCount">0 saved</span></div>
          <div id="annotationList" class="annotation-list"></div>
        </div>
      </section>
      <div id="connectionStatus" class="connection-status">connecting…</div>
    </section>
  </main>

  <dialog id="noteDialog" class="note-dialog">
    <form id="noteForm" method="dialog">
      <div id="noteTitle" class="note-title">marker message</div>
      <label for="noteInput">text bubble</label>
      <textarea id="noteInput" maxlength="240" rows="3" placeholder="type a note for this spot"></textarea>
      <div class="note-actions">
        <button id="cancelNote" type="button">cancel</button>
        <button type="submit">save</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
